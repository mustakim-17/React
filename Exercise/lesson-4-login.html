<!DOCTYPE html>
<html>
  <head>
    <title>Lesson-4-login</title>
    <style>
      body{
        font-family: Arial;
      }

      div{
        margin-bottom: 10px;
      }

      button{
        padding: 13px 18px;
        border-radius: 10px;
        border: none;
        background-color: rgb(0,123,255);
        color: white;
        margin-left: 10px;
        margin-top: 0px;
      }

      .greeting{
        font-size: 27px;
      }

      .input-form{
        width: 240px;
        padding: 12px;
        border-radius: 10px;
      }

      .login-btn{
        margin-left: 0;
      }

      .button-div{
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function LoginForm () {
        const [showPassword,setShowPassword] =React.useState(true);

        function password () {
          if (showPassword) {
            setShowPassword(false);
          } else if (!showPassword) {
            setShowPassword(true);
          }
        }

        return(
          <>
            <p className = "greeting">Hello,welcome to my website</p>
            <div>
              <input placeholder="Email" className="input-form" />
            </div>
            <div>
              { showPassword 
                ? 
                  <div>
                    <input placeholder="Password"         
                    className="input-form" type="text" />
                    <button onClick = {password}>Hide</button>
                  </div>
                :
                  <div>
                    <input placeholder="Password"         
                    className="input-form" type="password" />
                    <button onClick = {password}>Show</button>
                  </div>
              }
            </div>
            <div className="button-div">
              <button className="login-btn">Login</button>
              <button>Sign up</button>
            </div>
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<LoginForm />);
    </script>
  </body>
</html>
