<!DOCTYPE html>
<html>
  <head>
    <title>lesson-2</title>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>

    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

      function ProductDetails ({name , price , discountPrice , imagesrc}) {
        return(
          <div>
            <img src={imagesrc} width="150px" />
            <p>{name}</p>
            {discountPrice ?
              <div>
                <del><p>Price:${price}</p></del>
                <p>Discount price:${discountPrice}</p>
              </div> : 

              <p>Price:${price}</p>
            }
            <button>Add to Cart</button>
          </div>
        );
      }

      function App () {
        return(
          <>
            <ProductDetails 
              name="Cotton socks" 
              price="10.90" 
              discountPrice="5.45"
              imagesrc="Images-exercise/cotton-socks.png"
            />
            <ProductDetails 
              name="Tennis balls" 
              price="6.00"
              discountPrice="3.00" 
              imagesrc="Images-exercise/tennis-balls.png"
            />
            <ProductDetails 
              name="Plain T-Shirt" 
              price="7.99" 
              imagesrc="Images-exercise/plain-t-shirt.png"
            />
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
