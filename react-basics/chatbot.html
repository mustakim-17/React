<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }

      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      .chat-input{
        padding: 12px 13px;
        border-radius: 10px;
        border-width: 1px ;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container{
        display: flex;
        margin-bottom: 60px;
      }

      .app-container{
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .chat-msg-text{
        background-color: rgb(238,238,238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-left: 12px;
        margin-right: 12px;
        max-width: 300px;
      }

      .chat-msg-user {
        display: flex;
        justify-content: end;
        align-items: start;
        margin-bottom: 15px;
      }

      .chat-msg-robot{
        display: flex;
        justify-content: start;
        align-items: start;
        margin-bottom: 15px;
      }

      .chat-msg-profile{
        width: 45px;
      }

      .chat-messages-container {
        flex-grow: 1;
        margin-top: 15px;
        overflow: scroll;
        scrollbar-width: none;
      }

      .loading-icon{
        width: 20px;
      }

      .welcome-msg{
        color: rgb(120, 120, 120);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ChatInput ({chatMessages,setChatMessages}) {
        const [inputText,setInputText] = React.useState('');
        const [isLoading, setIsLoading] = React.useState(false);
        
        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          if (isLoading || inputText === '') {
            return;
          }
          setIsLoading(true);

          setInputText('');
          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }
          ];

          setChatMessages([
            ...newChatMessages,
            {
              message: <img src="Images/loading-spinner.gif" className="loading-icon" />,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
                    
          const response = await Chatbot.getResponseAsync(inputText);
          
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
          setIsLoading(false);
        }

        function handleKeyDown(event) {
          if (event.key === 'Enter') {
            sendMessage();
          } else if (event.key === 'Escape') {
            setInputText('')
          }
        }

        return(
          <div
            className="chat-input-container"
          >
            <input 
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value = {inputText}
              onKeyDown = {handleKeyDown}
              className="chat-input"
            />

            <button
              onClick={sendMessage}
              className="send-button"
            >Send</button>
          </div>
        );
      }

      function ChatMessage({message , sender}) {
        //const message = props.message;
        //const sender = props.sender;
        //const {message , sender} = props;

        /*
        if (sender === 'robot') {
          return(
            <div>
              <img src="Images/robot.png" width="50px" />
              {message}
            </div>
          );
        }
        */

        return(
          <div className = {
            sender === 'user' 
              ? 'chat-msg-user' 
              : 'chat-msg-robot'
          }>
            {sender === 'robot' && (
              <img src="Images/robot.png" className="chat-msg-profile" />
            )}

            <div className="chat-msg-text">
              {message}
            </div>

            {sender === 'user' && (
              <img src="Images/user.png" className="chat-msg-profile" />
            )}
          </div>
        );

      }

      function useAutoScroll(dependencies) {
        const containerRef = React.useRef(null);

        React.useEffect(() => {
          const containerElem = containerRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight
          }
        }, dependencies);

        return containerRef;
      }

      function ChatMessages ({chatMessages}) {
        const chatMessagesRef = useAutoScroll([chatMessages]);

        return(
          <div
            className="chat-messages-container" 
            ref={chatMessagesRef}
          >
            {chatMessages.map((chatMessage) => {
              return(
                <ChatMessage 
                  message = {chatMessage.message}
                  sender = {chatMessage.sender}
                  key= {chatMessage.id}
                />
              );
            })}
          </div>
        );
      }

      

      function App() {

        const [chatMessages , setChatMessages] = React.useState([]);

        //const chatMessages = array[0];
        //const setChatMessages = array[1];
        //const [chatMessages , setChatMessages] = array;

        return(
          <div className="app-container">
            {chatMessages.length === 0 && (
              <p className="welcome-msg">
                Welcome to the chatbot project! Send a Message using the textbox below  
              </p>
            )}
            <ChatMessages
              chatMessages = {chatMessages}
            />
            <ChatInput
              chatMessages = {chatMessages}
              setChatMessages = {setChatMessages}
            />
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
